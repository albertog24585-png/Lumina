​function switchTab(tab) {
const exploreSec = document.getElementById('exploreSection');
const shortsSec = document.getElementById('shortsSection');
const tabExploreBtn = document.getElementById('tabExploreBtn');
const tabShortsBtn = document.getElementById('tabShortsBtn');
​if (tab === 'explore') {
exploreSec.classList.remove('hidden');
shortsSec.classList.add('hidden');
tabExploreBtn.className = "px-4 py-1.5 rounded-full text-xs font-bold transition-all bg-gradient-to-r from-lumina-cyan to-lumina-purple text-black shadow-neon-cyan";
tabShortsBtn.className = "px-4 py-1.5 rounded-full text-xs font-bold text-gray-400 hover:text-white transition-all flex items-center gap-1.5";
} else {
exploreSec.classList.add('hidden');
shortsSec.classList.remove('hidden');
tabShortsBtn.className = "px-4 py-1.5 rounded-full text-xs font-bold transition-all bg-gradient-to-r from-lumina-magenta to-lumina-purple text-white shadow-neon-magenta flex items-center gap-1.5";
tabExploreBtn.className = "px-4 py-1.5 rounded-full text-xs font-bold text-gray-400 hover:text-white transition-all";
}
}
​function renderFeed(filterTag = 'Todos', searchQuery = '') {
const grid = document.getElementById('postsGrid');
const emptyMsg = document.getElementById('emptyFeedMessage');
grid.innerHTML = '';
​let filtered = posts.filter(post => {
const matchesTag = filterTag === 'Todos' || post.tag === filterTag;
const matchesSearch = post.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
post.author.toLowerCase().includes(searchQuery.toLowerCase());
return matchesTag && matchesSearch;
});
​if (filtered.length === 0) {
emptyMsg.classList.remove('hidden');
return;
} else {
emptyMsg.classList.add('hidden');
}
​filtered.forEach(post => {
const card = document.createElement('div');
card.className = "bg-lumina-card border border-lumina-border rounded-xl overflow-hidden hover:border-lumina-cyan transition-all duration-300 hover:-translate-y-1 group flex flex-col justify-between";
card.innerHTML = <div class="relative overflow-hidden cursor-pointer aspect-square" onclick="openDetailModal(${post.id})"> <img src="${post.image}" alt="${post.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"> <span class="absolute top-3 left-3 bg-black/70 backdrop-blur-md text-lumina-cyan text-[10px] font-bold px-2.5 py-1 rounded-full border border-lumina-cyan/30"> #${post.tag} </span> </div> <div class="p-4 flex flex-col justify-between flex-1"> <h3 class="font-display font-bold text-white text-base line-clamp-1 mb-2 group-hover:text-lumina-cyan transition-colors cursor-pointer" onclick="openDetailModal(${post.id})">${post.title}</h3> <div class="flex items-center justify-between pt-2 border-t border-lumina-border/50"> <div class="flex items-center gap-2"> <img src="${post.avatar}" class="w-6 h-6 rounded-full object-cover border border-lumina-cyan"> <span class="text-xs text-gray-400 font-medium">${post.author}</span> </div> <button onclick="toggleLike(${post.id})" class="flex items-center gap-1.5 text-xs font-semibold ${post.liked ? 'text-lumina-magenta' : 'text-gray-400 hover:text-white'}"> <i class="${post.liked ? 'fa-solid' : 'fa-regular'} fa-heart"></i> <span>${post.likes}</span> </button> </div> </div>;
grid.appendChild(card);
});
}
​function renderShortsFeed() {
const container = document.getElementById('shortsFeed');
container.innerHTML = '';
​shorts.forEach(short => {
const reel = document.createElement('div');
reel.className = "reel-card w-full h-full relative flex items-center justify-center bg-black";
reel.innerHTML = <video src="${short.videoUrl}" class="w-full h-full object-cover" loop autoplay muted playsinline onclick="toggleVideoPlay(this)"></video> <div class="absolute inset-0 bg-gradient-to-b from-black/20 via-transparent to-black/80 pointer-events-none"></div> <div class="absolute bottom-5 left-4 right-16 text-white pointer-events-none"> <div class="flex items-center gap-2 mb-2"> <img src="${short.avatar}" class="w-8 h-8 rounded-full border border-lumina-cyan object-cover"> <span class="text-xs font-bold">@${short.author}</span> </div> <h4 class="font-display font-bold text-sm mb-1">${short.title}</h4> <p class="text-xs text-gray-300 line-clamp-2">${short.desc}</p> </div> <div class="absolute right-3 bottom-8 flex flex-col items-center gap-5 z-10"> <button onclick="toggleShortLike(${short.id}, this)" class="flex flex-col items-center gap-1"> <div class="w-10 h-10 rounded-full bg-black/60 border border-lumina-border flex items-center justify-center ${short.liked ? 'text-lumina-magenta' : 'text-white'}"> <i class="fa-solid fa-heart text-lg"></i> </div> <span class="text-[10px] font-bold text-white">${short.likes}</span> </button> <button onclick="showToast('Comentarios')" class="flex flex-col items-center gap-1"> <div class="w-10 h-10 rounded-full bg-black/60 border border-lumina-border flex items-center justify-center text-white"> <i class="fa-solid fa-comment text-lg"></i> </div> <span class="text-[10px] font-bold text-white">${short.commentsCount}</span> </button> </div>;
container.appendChild(reel);
});
}
​function toggleVideoPlay(video) {
if (video.paused) {
video.play();
} else {
video.pause();
}
}
​function toggleLike(postId) {
const post = posts.find(p => p.id === postId);
if (post) {
post.liked = !post.liked;
post.likes += post.liked ? 1 : -1;
renderFeed();
}
}
​function toggleShortLike(shortId, btn) {
const short = shorts.find(s => s.id === shortId);
if (short) {
short.liked = !short.liked;
short.likes += short.liked ? 1 : -1;
renderShortsFeed();
}
}
​function filterByTag(tag, btn) {
document.querySelectorAll('.tag-btn').forEach(b => {
b.className = "tag-btn px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap border border-lumina-border text-gray-300 hover:border-lumina-cyan hover:text-lumina-cyan";
});
btn.className = "tag-btn px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap border bg-lumina-cyan/20 border-lumina-cyan text-lumina-cyan shadow-neon-cyan";
renderFeed(tag);
}
​function handleSearch(query) {
renderFeed('Todos', query);
}
​function openDetailModal(postId) {
const post = posts.find(p => p.id === postId);
if (!post) return;
currentActivePostId = postId;
​document.getElementById('detailImage').src = post.image;
document.getElementById('detailAuthor').innerText = post.author;
document.getElementById('detailAvatar').src = post.avatar;
document.getElementById('detailTag').innerText = #${post.tag};
document.getElementById('detailTitle').innerText = post.title;
document.getElementById('detailDesc').innerText = post.desc;
document.getElementById('detailLikesCount').innerText = post.likes;
​renderComments(post.comments);
openModal('detailModal');
}
​function renderComments(comments) {
const list = document.getElementById('commentsList');
list.innerHTML = '';
if (comments.length === 0) {
list.innerHTML = '<p class="text-xs text-gray-500">Sé el primero en comentar.</p>';
return;
}
comments.forEach(c => {
const item = document.createElement('div');
item.className = "bg-lumina-bg/60 p-2.5 rounded-lg border border-lumina-border/40 text-xs";
item.innerHTML = <span class="font-bold text-lumina-cyan mr-1.5">${c.author}:</span><span class="text-gray-300">${c.text}</span>;
list.appendChild(item);
});
}
​function handleAddComment(e) {
e.preventDefault();
const input = document.getElementById('commentInput');
const text = input.value.trim();
if (!text || !currentActivePostId) return;
​const post = posts.find(p => p.id === currentActivePostId);
if (post) {
post.comments.push({ author: "Tú", text });
renderComments(post.comments);
input.value = '';
showToast("Comentario agregado");
}
}
​function handleCreatePost(e) {
e.preventDefault();
const type = document.getElementById('postTypeInput').value;
const title = document.getElementById('postTitleInput').value;
const media = document.getElementById('postMediaInput').value;
const tag = document.getElementById('postTagInput').value;
const desc = document.getElementById('postDescInput').value;
​if (type === 'image') {
posts.unshift({
id: Date.now(),
title,
tag,
author: "Alex_Rivers",
avatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80",
image: media,
likes: 1,
liked: true,
desc,
comments: []
});
renderFeed();
} else {
shorts.unshift({
id: Date.now(),
author: "Alex_Rivers",
avatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80",
videoUrl: media,
title,
desc,
audio: "Audio Original",
likes: 1,
liked: true,
commentsCount: 0
});
renderShortsFeed();
}
​closeModal('newPostModal');
showToast("Publicado correctamente en Lumina");
}
​function openModal(id) {
const modal = document.getElementById(id);
modal.classList.remove('opacity-0', 'pointer-events-none');
}
​function closeModal(id) {
const modal = document.getElementById(id);
modal.classList.add('opacity-0', 'pointer-events-none');
}
​function showToast(msg) {
const toast = document.getElementById('toast');
document.getElementById('toastMessage').innerText = msg;
toast.classList.remove('translate-y-20', 'opacity-0');
setTimeout(() => {
toast.classList.add('translate-y-20', 'opacity-0');
}, 2500);
}
</script>
</body>
</html>
