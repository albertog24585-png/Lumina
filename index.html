<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumina</title>
<style>
* {
margin: 0;
padding: 0;
box-sizing: border-box;
}
body, html {
width: 100%;
height: 100%;
background-color: #000;
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
overflow: hidden;
}
.container {
position: relative;
width: 100%;
height: 100%;
max-width: 480px;
margin: 0 auto;
background: #111;
display: flex;
justify-content: center;
align-items: center;
}
video {
width: 100%;
height: 100%;
object-fit: cover;
}
.header {
position: absolute;
top: 20px;
width: 100%;
text-align: center;
color: white;
font-size: 1.2rem;
font-weight: bold;
z-index: 10;
text-shadow: 0 2px 4px rgba(0,0,0,0.5);
}
.sidebar {
position: absolute;
right: 15px;
bottom: 80px;
display: flex;
flex-direction: column;
align-items: center;
gap: 20px;
z-index: 10;
color: white;
}
.action-btn {
background: rgba(0, 0, 0, 0.4);
border: none;
color: white;
width: 45px;
height: 45px;
border-radius: 50%;
display: flex;
justify-content: center;
align-items: center;
font-size: 1.2rem;
cursor: pointer;
}
</style>
</head>
<body>
<div class="container">
<div class="header">Lumina</div>
<video id="videoPlayer" controls src=https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoyrides1.mp4 autoplay loop muted playsinline></video>
<div class="sidebar">
<button class="action-btn" onclick="toggleLike()">❤️</button>
<button class="action-btn" onclick="toggleMute()">🔊</button>
</div>
</div>
​<script>
const video = document.getElementById('videoPlayer');
​function toggleLike() {
alert('¡Te gusta este video!');
}
​function toggleMute() {
video.muted = !video.muted;
alert(video.muted ? 'Video silenciado' : 'Audio activado');
}
</script>
</body>
</html>
